# Explicit disposable local development/test stack. Never use this for production.
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: hardware_erp_test
      POSTGRES_USER: erp_migrator
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set a local-only password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_test_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_migrator -d hardware_erp_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., target: backend}
    environment: &local-environment
      NODE_ENV: test
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hardware_erp_test
      DB_USER: erp_app
      DB_PASSWORD: ${LOCAL_APP_DB_PASSWORD:?Set a separate local application password}
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${LOCAL_SESSION_SECRET:?Generate a local session secret}
      CORS_ORIGIN: http://localhost:5173
      STORAGE_DRIVER: disabled
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  migrate:
    build: {context: ., target: backend}
    profiles: [tools]
    command: ["node", "../db/migrations/index.js"]
    environment:
      <<: *local-environment
      MIGRATION_DB_USER: erp_migrator
      MIGRATION_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set a local-only password}
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_test_data:
